<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fwprobe · 节点状态</title>
<style>
  :root {
    --bg: #0b0f14;
    --card: rgba(26, 33, 43, .72);
    --border: rgba(255, 255, 255, .10);
    --text: #e6edf3;
    --muted: #8b98a9;
    --accent: #4da3ff;
    --ok: #34d399;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 18px 60px;
    font: 14px/1.6 -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(61,139,253,.16), transparent 60%),
      radial-gradient(700px 400px at 100% 0%, rgba(34,197,94,.10), transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 19px; margin: 0; letter-spacing: .3px; }
  .ver { color: var(--muted); font-size: 12px; }
  .meta { margin-left: auto; color: var(--muted); font-size: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 4px 20px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.04);
    padding: 16px 18px; margin-bottom: 14px;
  }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px rgba(52,211,153,.8); }
  .dot.off { background: var(--bad); }
  .alias { font-weight: 600; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 12px; }
  .k { color: var(--muted); font-size: 11px; }
  .v { font-variant-numeric: tabular-nums; }
  .lat { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .lat b { color: var(--text); font-weight: 600; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 26px; }
  code { background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>fwprobe · 节点状态</h1>
    <span class="ver" id="ver"></span>
    <span class="meta" id="meta"></span>
  </header>
  <div id="nodes"><div class="card empty">加载中…</div></div>
  <footer>数据来源：各节点 agent 主动上报 · 超过 <span id="offline_after">120</span> 秒无上报判定离线</footer>
</div>

<script>
const $ = id => document.getElementById(id);

function fmtBytes(n) {
  if (n === null || n === undefined) return "-";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0, v = Number(n);
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (v >= 100 ? Math.round(v) : v.toFixed(1)) + " " + u[i];
}

function fmtSpeed(n) { return (n === null || n === undefined) ? "-" : fmtBytes(n) + "/s"; }

function pct(used, total) {
  if (!total) return "-";
  return (100 * used / total).toFixed(1) + "%";
}

function ago(ts) {
  if (!ts) return "从未上报";
  const d = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (d < 60) return d + " 秒前";
  if (d < 3600) return Math.floor(d / 60) + " 分钟前";
  if (d < 86400) return Math.floor(d / 3600) + " 小时前";
  return Math.floor(d / 86400) + " 天前";
}

function card(n) {
  const s = n.sample || {};
  const mem = s.mem_used != null ? pct(s.mem_used, s.mem_total) : "-";
  const disk = s.disk_used != null ? pct(s.disk_used, s.disk_total) : "-";
  const checks = (n.checks || []).filter(c => c.ok !== null).map(c => {
    const v = c.ok ? (c.ravg != null ? c.ravg.toFixed(0) + " ms" : "-") : "失败";
    return `<span>${c.name} <b>${v}</b>${c.loss ? ` <span style="color:var(--bad)">${c.loss}%</span>` : ""}</span>`;
  }).join("");
  return `
  <div class="card">
    <div class="row">
      <span class="dot ${n.online ? "on" : "off"}"></span>
      <span class="alias">${n.alias || n.id}</span>
      ${n.group ? `<span class="tag">${n.group}</span>` : ""}
      ${n.os_id ? `<span class="tag">${n.os_id}</span>` : ""}
      <span class="tag" style="margin-left:auto">${n.online ? "在线" : "离线 · " + ago(n.last_seen)}</span>
    </div>
    <div class="grid">
      <div><div class="k">CPU</div><div class="v">${s.cpu != null ? s.cpu.toFixed(2) + "%" : "-"}</div></div>
      <div><div class="k">内存</div><div class="v">${mem}</div></div>
      <div><div class="k">磁盘</div><div class="v">${disk}</div></div>
      <div><div class="k">负载</div><div class="v">${s.load1 != null ? s.load1.toFixed(2) : "-"}</div></div>
      <div><div class="k">下行</div><div class="v">${fmtSpeed(s.rx_bps)}</div></div>
      <div><div class="k">上行</div><div class="v">${fmtSpeed(s.tx_bps)}</div></div>
      <div><div class="k">TCP</div><div class="v">${s.tcp != null ? s.tcp : "-"}</div></div>
      <div><div class="k">UDP</div><div class="v">${s.udp != null ? s.udp : "-"}</div></div>
    </div>
    <div class="lat">${checks || '<span>暂无探测数据</span>'}</div>
  </div>`;
}

async function load() {
  try {
    const r = await fetch("/api/public/summary", { cache: "no-store" });
    const d = await r.json();
    $("ver").textContent = "v" + (d.version || "");
    $("offline_after").textContent = d.offline_after || 120;
    const list = d.nodes || [];
    $("meta").textContent = `${list.filter(n => n.online).length}/${list.length} 在线`;
    $("nodes").innerHTML = list.length ? list.map(card).join("")
      : `<div class="card empty">还没有节点。在中心添加节点后，用生成的命令安装 agent。</div>`;
  } catch (e) {
    $("nodes").innerHTML = `<div class="card empty">加载失败：${e.message}</div>`;
  }
}

load();
setInterval(load, 10000);
</script>
</body>
</html>
